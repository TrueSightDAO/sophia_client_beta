<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrueSight Ops Console</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span id="appTitle">TrueSight Ops Console</span>
        <span id="deployment" class="deployment"></span>
      </div>
      <div class="auth-banner" id="authBanner" hidden></div>
      <button id="connectBtn" class="connect">Connect identity</button>
      <div id="channelList" class="channel-list"></div>
      <button id="newChannelBtn" class="new-channel" hidden>+ Channel</button>
      <button id="newCategoryBtn" class="new-channel" hidden>+ Category</button>
      <div id="identity" class="identity"></div>
    </aside>

    <main class="chat">
      <header class="chat-header" id="chatHeader"># select a channel</header>
      <div id="messages" class="messages"></div>
      <div id="composer" class="composer" hidden>
        <button id="attachBtn" class="attach" title="Attach files">📎</button>
        <textarea id="messageInput" rows="1" placeholder="Message Sophia… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="sendBtn" class="send">Send</button>
        <input type="file" id="fileInput" multiple hidden />
      </div>
    </main>
  </div>

  <div id="channelModal" class="modal" hidden>
    <div class="modal-card">
      <h3>New channel</h3>
      <label>Name <input id="channelName" placeholder="e.g. sunmint-signatures" /></label>
      <label>Category
        <select id="channelCategory"></select>
      </label>
      <label>Visibility
        <select id="channelVisibility">
          <option value="private">private (governor/sentinel only)</option>
          <option value="public">public (everyone)</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="channelCancelBtn">Cancel</button>
        <button id="channelCreateBtn" class="send">Create</button>
      </div>
    </div>
  </div>

  <div id="categoryModal" class="modal" hidden>
    <div class="modal-card">
      <h3>New category</h3>
      <label>Name <input id="categoryName" placeholder="e.g. Brazil" /></label>
      <div class="modal-actions">
        <button id="categoryCancelBtn">Cancel</button>
        <button id="categoryCreateBtn" class="send">Create</button>
      </div>
    </div>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/channels.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
